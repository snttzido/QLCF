{% extends 'base.html' %}

{% block title %}Đăng nhập nhân viên{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5 col-lg-4">

        <div class="card shadow-sm border-0">

            <div class="card-body p-4">

                <div class="text-center mb-4">

                    <i class="bi bi-person-badge-fill" style="font-size: 3rem; color:#6f4e37;"></i>

                    <h3 class="mt-2">
                        Đăng nhập nhân viên
                    </h3>

                    <p class="text-muted">
                        Quản lý quán cà phê
                    </p>

                </div>

                <form method="post">

                    <div class="mb-3">

                        <label class="form-label">
                            Tên đăng nhập
                        </label>

                        <input type="text" name="username" class="form-control" placeholder="Nhập tên đăng nhập"
                            required>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Mật khẩu
                        </label>

                        <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu"
                            required>

                    </div>

                    <button type="submit" class="btn btn-cafe w-100">

                        <i class="bi bi-box-arrow-in-right"></i>

                        Đăng nhập

                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="{{ url_for('menu') }}" class="text-decoration-none">

                        ← Về trang khách hàng

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
