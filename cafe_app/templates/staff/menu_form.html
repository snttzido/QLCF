{% extends 'base.html' %}
{% block title %}{{ 'Sửa món' if mon else 'Thêm món' }}{% endblock %}
{% block content %}
<h3 class="mb-4"><i class="bi bi-pencil-square"></i> {{ 'Sửa món' if mon else 'Thêm món mới' }}</h3>
<div class="cafe-card bg-white p-4" style="max-width:600px">
<form method="post">
  <div class="mb-3">
    <label class="form-label">Tên món</label>
    <input type="text" class="form-control" name="ten" required value="{{ mon.ten if mon else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Loại</label>
    <select class="form-select" name="loai">
      <option value="Đồ uống" {% if mon and mon.loai=='Đồ uống' %}selected{% endif %}>Đồ uống</option>
      <option value="Đồ ăn" {% if mon and mon.loai=='Đồ ăn' %}selected{% endif %}>Đồ ăn</option>
    </select>
  </div>
  <div class="mb-3">
    <label class="form-label">Giá (đ)</label>
    <input type="number" class="form-control" name="gia" min="0" required value="{{ mon.gia if mon else '' }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Mô tả</label>
    <textarea class="form-control" name="mo_ta" rows="3">{{ mon.mo_ta if mon else '' }}</textarea>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="con_ban" id="conBan" {% if not mon or mon.con_ban %}checked{% endif %}>
    <label class="form-check-label" for="conBan">Còn bán</label>
  </div>
  <button type="submit" class="btn btn-cafe"><i class="bi bi-save"></i> Lưu</button>
  <a href="{{ url_for('staff_menu') }}" class="btn btn-outline-secondary">Hủy</a>
</form>
</div>
{% endblock %}
