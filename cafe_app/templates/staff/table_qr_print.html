<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR - {{ ban.so_ban }}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body { background:#fff; }
  .qr-card {
    width: 320px; margin: 40px auto; text-align:center;
    border: 3px solid #4b3621; border-radius: 16px; padding: 28px 20px;
  }
  .qr-card h2 { color:#4b3621; margin-bottom:4px; }
  .qr-card .sub { color:#8a7a6b; margin-bottom: 18px; }
  @media print {
    .no-print { display:none; }
    .qr-card { border: 2px solid #000; }
  }
</style>
</head>
<body>
  <div class="no-print text-center py-3">
    <a href="{{ url_for('staff_tables') }}" class="btn btn-outline-secondary btn-sm">&larr; Quay lại</a>
    <button onclick="window.print()" class="btn btn-dark btn-sm"><i class="bi bi-printer"></i> In mã QR</button>
  </div>

  <div class="qr-card">
    <h2>{{ ban.so_ban }}</h2>
    <div class="sub">Quét mã để xem menu &amp; đặt món</div>
    <div id="qrcode" class="d-flex justify-content-center"></div>
    <div class="mt-3 small text-muted" style="word-break:break-all">{{ ban_url }}</div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    new QRCode(document.getElementById("qrcode"), {
      text: {{ ban_url|tojson }},
      width: 240,
      height: 240
    });
  </script>
</body>
</html>
